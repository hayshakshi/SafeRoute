
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SafeRoute</title>

<link rel="stylesheet"
      href="/static/style.css?v=10">

</head>
<body>
    <header>
        <h2>SafeRoute</h2>
        <nav>
            <a href="/">Home</a>
            <a href="/reports">View Reports</a>
            <a href="/track">Track Report</a>
        </nav>
    </header>

    <section class="report-section">
        <h1>Admin Login</h1>
        <p>Authorized administrators only.</p>

        <form method="POST" action="/admin/login"
              class="track-form">

            <label for="password">Admin Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">Login</button>
        </form>

        {% if error %}
            <p class="track-error">{{ error }}</p>
        {% endif %}
    </section>
</body>
</html>
